name: Apply IteractionList five visible buttons fix

on:
  push:
    branches:
      - agent/iteraction-list-five-visible-buttons
    paths:
      - .github/workflows/apply-iteraction-five-visible-buttons.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iteraction-list-five-visible-buttons
          fetch-depth: 0

      - name: Apply targeted source, test and documentation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller_path = Path('modules/web/src/com/company/hunttech/web/screens/iteractionlist/IteractionListEdit.java')
          controller = controller_path.read_text(encoding='utf-8')
          old = '''    /**
     * Строит быстрые действия по неизменяемому бизнес-контракту формы:
     * {@link InteractionService} возвращает до пяти наиболее частых типов
     * взаимодействия текущего рекрутёра за последний календарный месяц.
     *
     * Визуальный рефакторинг не должен переносить агрегацию в контроллер,
     * менять период, пользователя или назначение точного объекта Iteraction.
     */
    private void setMostPopularIteraction() {
        mostPopular = interactionService.getMostPolularIteraction(
                userSession.getUser(), POPULAR_INTERACTION_BUTTONS);

        mostPopularHbox.removeAll();
        List<Button> popularButtons = new ArrayList<>();
        int buttonCount = Math.min(POPULAR_INTERACTION_BUTTONS, mostPopular.size());

        for (int index = 0; index < buttonCount; index++) {
            Iteraction interaction = mostPopular.get(index);
            if (interaction == null) {
                continue;
            }

            Button popularButton = uiComponents.create(Button.class);
            popularButton.setWidth("100%");
            popularButton.setStyleName("iteraction-list-popular-button");
            popularButton.setCaption(interaction.getIterationName());
            popularButton.addClickListener(clickEvent -> {
                iteractionTypeField.setValue(interaction);
                iteractionTypeField.focus();
            });

            mostPopularHbox.add(popularButton);
            popularButtons.add(popularButton);
        }

        // HBoxLayout.expand в CUBA 7.3 принимает один Component за вызов.
        // Одинаковый expand ratio сохраняет равную ширину фактически созданных кнопок.
        for (Button popularButton : popularButtons) {
            mostPopularHbox.expand(popularButton);
        }
    }
'''
          new = '''    /**
     * Строит пять постоянно видимых UI-позиций быстрых действий.
     * {@link InteractionService} по-прежнему определяет бизнес-данные: до пяти
     * наиболее частых типов текущего рекрутёра за последний календарный месяц.
     *
     * Пустая позиция является только disabled-placeholder и не меняет сущность.
     * Визуальный рефакторинг не должен переносить агрегацию в контроллер,
     * менять период, пользователя или назначение точного объекта Iteraction.
     */
    private void setMostPopularIteraction() {
        mostPopular = interactionService.getMostPolularIteraction(
                userSession.getUser(), POPULAR_INTERACTION_BUTTONS);

        mostPopularHbox.removeAll();
        List<Button> popularButtons = new ArrayList<>();

        for (int index = 0; index < POPULAR_INTERACTION_BUTTONS; index++) {
            Button popularButton = uiComponents.create(Button.class);
            popularButton.setWidth("100%");
            popularButton.setStyleName("iteraction-list-popular-button");

            Iteraction interaction = index < mostPopular.size() ? mostPopular.get(index) : null;
            if (interaction != null) {
                popularButton.setCaption(interaction.getIterationName());
                popularButton.addClickListener(clickEvent -> {
                    iteractionTypeField.setValue(interaction);
                    iteractionTypeField.focus();
                });
            } else {
                configureEmptyPopularButton(popularButton);
            }

            mostPopularHbox.add(popularButton);
            popularButtons.add(popularButton);
        }

        // HBoxLayout.expand в CUBA 7.3 принимает один Component за вызов.
        // Равный expand ratio сохраняет стабильную геометрию 5 × 20%.
        for (Button popularButton : popularButtons) {
            mostPopularHbox.expand(popularButton);
        }
    }

    /**
     * Оставляет визуальную позицию в блоке, но исключает любое бизнес-действие.
     */
    private void configureEmptyPopularButton(Button popularButton) {
        popularButton.setCaption("Нет данных");
        popularButton.setEnabled(false);
    }
'''
          if old not in controller:
              raise SystemExit('Controller target block not found')
          controller_path.write_text(controller.replace(old, new), encoding='utf-8')

          test_path = Path('modules/core/test/com/company/hunttech/core/IteractionListMostPopularInteractionTest.java')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              'public void formCreatesUpToFiveEqualGreenButtons() throws IOException {',
              'public void formCreatesExactlyFiveVisibleSlotsWithoutChangingService() throws IOException {')
          test = test.replace(
              '        assertTrue(controller.contains(\n                "int buttonCount = Math.min(POPULAR_INTERACTION_BUTTONS, mostPopular.size())"));\n        assertTrue(controller.contains("index < buttonCount"));',
              '        assertTrue(controller.contains("index < POPULAR_INTERACTION_BUTTONS"));\n        assertTrue(controller.contains(\n                "Iteraction interaction = index < mostPopular.size() ? mostPopular.get(index) : null"));')
          test = test.replace(
              '        assertFalse(controller.contains("configureEmptyPopularButton"));\n        assertFalse(controller.contains("Нет данных"));',
              '        assertTrue(controller.contains("configureEmptyPopularButton"));\n        assertTrue(controller.contains("popularButton.setCaption(\\"Нет данных\\")"));\n        assertTrue(controller.contains("popularButton.setEnabled(false)"));')
          test_path.write_text(test, encoding='utf-8')

          ui_doc_path = Path('docs/ui/IteractionListEdit_Spec.md')
          ui_doc = ui_doc_path.read_text(encoding='utf-8')
          ui_doc = ui_doc.replace(
              '5. Лимит — до пяти фактически найденных типов; искусственные placeholder-кнопки не создаются.',
              '5. Сервис возвращает до пяти фактически найденных типов; форма всегда показывает пять UI-позиций, а отсутствующие данные представлены disabled-кнопками «Нет данных» без бизнес-действия.')
          ui_doc = ui_doc.replace(
              'Блок до пяти частых взаимодействий является ускорителем ежедневного ввода.',
              'Блок пяти постоянно видимых позиций частых взаимодействий является ускорителем ежедневного ввода.')
          ui_doc = ui_doc.replace(
              'внутри вкладки перед первым рабочим аккордеоном постоянно отображается блок до пяти быстрых взаимодействий.',
              'внутри вкладки перед первым рабочим аккордеоном постоянно отображается блок из пяти быстрых позиций.')
          ui_doc = ui_doc.replace(
              '- открытие вкладки → `mostPopularHbox` уже находится перед первым аккордеоном → отображаются до пяти фактически найденных быстрых кнопок без дополнительного действия;\n- сервис возвращает менее пяти типов → форма отображает только фактически найденные действия → искусственные placeholder-кнопки не создаются;',
              '- открытие вкладки → `mostPopularHbox` уже находится перед первым аккордеоном → отображаются ровно пять визуальных позиций;\n- сервис возвращает менее пяти типов → найденные позиции активны, остальные показывают disabled «Нет данных» → бизнес-логика сервиса и сущности не изменяется;')
          marker = '| Дата | Изменение |\n|---|---|\n'
          if marker in ui_doc and 'Восстановлены ровно пять постоянно видимых UI-позиций' not in ui_doc:
              ui_doc = ui_doc.replace(marker, marker + '| 2026-07-27 | Восстановлены ровно пять постоянно видимых UI-позиций; пустые позиции disabled, бизнес-логика InteractionService не изменена |\n', 1)
          ui_doc_path.write_text(ui_doc, encoding='utf-8')

          legacy_doc_path = Path('docs/screens/iteraction-list/hunttech_IteractionList.edit_Spec.md')
          legacy_doc = legacy_doc_path.read_text(encoding='utf-8')
          legacy_doc = legacy_doc.replace(
              '5. Лимит — до пяти фактически найденных типов; искусственные placeholder-кнопки не создаются.',
              '5. Сервис возвращает до пяти фактически найденных типов; форма всегда показывает пять UI-позиций, а отсутствующие данные представлены disabled-кнопками «Нет данных» без бизнес-действия.')
          legacy_doc = legacy_doc.replace(
              'До пяти наиболее частых взаимодействий текущего пользователя являются постоянными быстрыми действиями.',
              'Пять постоянно видимых позиций наиболее частых взаимодействий текущего пользователя являются быстрыми действиями; пустые позиции отключены.')
          legacy_doc = legacy_doc.replace(
              '- открытие → блок до пяти быстрых взаимодействий видим перед первым аккордеоном',
              '- открытие → блок из пяти визуальных позиций быстрых взаимодействий видим перед первым аккордеоном')
          legacy_doc = legacy_doc.replace(
              '0. `mostPopularQuickActions` — постоянно видимый блок до пяти частых взаимодействий внутри вкладки.',
              '0. `mostPopularQuickActions` — постоянно видимый блок из пяти позиций частых взаимодействий внутри вкладки.')
          marker = '| Дата | Изменение |\n|---|---|\n'
          if marker in legacy_doc and 'Восстановлены ровно пять постоянно видимых UI-позиций' not in legacy_doc:
              legacy_doc = legacy_doc.replace(marker, marker + '| 2026-07-27 | Восстановлены ровно пять постоянно видимых UI-позиций; пустые позиции disabled, бизнес-логика InteractionService не изменена |\n', 1)
          legacy_doc_path.write_text(legacy_doc, encoding='utf-8')

          instruction = Path('.ai/instructions/iteraction-list-five-visible-buttons.md')
          instruction.write_text('''# Hermes — проверка пяти видимых кнопок IteractionListEdit

PROJECT: HRM HuntTech
STATUS: WAITING_FOR_HERMES

Проверить точный HEAD ветки `agent/iteraction-list-five-visible-buttons` и PR напрямую в `master`. Код и документацию не изменять; commit, push, rebase, merge и production не выполнять.

## Неизменяемая бизнес-логика

- `IteractionListEdit` вызывает `InteractionService.getMostPolularIteraction(currentUser, 5)`;
- сервис анализирует последний календарный месяц;
- фильтр текущего рекрутёра, group by type и count DESC не изменены;
- заполненная кнопка устанавливает точный `Iteraction` в `iteractionTypeField`.

## Исправление presentation-слоя

- `mostPopularHbox` всегда содержит ровно пять кнопок;
- найденные сервисом типы отображаются активными;
- недостающие позиции показывают «Нет данных» и disabled;
- пустая позиция не имеет click listener и не меняет сущность;
- все пять позиций имеют равную ширину и видны перед `participantsAccordion`.

## Команды

```bash
git diff --check
./gradlew :app-web:compileJava :app-core:compileTestJava --no-daemon --stacktrace
./gradlew :app-core:test --tests 'com.company.hunttech.core.IteractionListMostPopularInteractionTest' --no-daemon --stacktrace
./gradlew test --tests '*ScreenViewIntegrityTest*' --no-daemon --stacktrace
./gradlew :app-web:buildScssThemes --no-daemon --stacktrace
./gradlew clean assemble --no-daemon --stacktrace
```

Ожидается: профильный тест `6/6 PASS`, `ScreenViewIntegrityTest 8/8 PASS`, SCSS PASS, `BUILD SUCCESSFUL`.

## Runtime smoke

1. Clean local deploy и HTTP `/hrm/` = 200.
2. Открыть `IteractionListEdit` пользователем без статистики за месяц: видны пять disabled-кнопок «Нет данных».
3. Открыть пользователем с 1–4 типами: всегда пять позиций, найденные активны, остальные disabled.
4. Открыть пользователем с 5+ типами: видны пять активных кнопок в порядке сервиса.
5. Клик по каждой активной кнопке устанавливает точный `Iteraction`; disabled-позиции ничего не меняют.
6. Проверить required/comment/addDate/addString/addInteger/buttonCallAction, save/cancel и Tomcat logs.

Успех: `STATUS: READY_TO_MERGE`, `проверен HEAD: <SHA>`, P1=0, P2=0. Новый commit аннулирует отчёт.
''', encoding='utf-8')
          PY

      - name: Remove transient workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-iteraction-five-visible-buttons.yml
          git config user.name "ChatGPT Agent"
          git config user.email "actions@users.noreply.github.com"
          git add modules/web/src/com/company/hunttech/web/screens/iteractionlist/IteractionListEdit.java \
                  modules/core/test/com/company/hunttech/core/IteractionListMostPopularInteractionTest.java \
                  docs/ui/IteractionListEdit_Spec.md \
                  docs/screens/iteraction-list/hunttech_IteractionList.edit_Spec.md \
                  .ai/instructions/iteraction-list-five-visible-buttons.md \
                  .github/workflows/apply-iteraction-five-visible-buttons.yml
          git commit -m "fix(iteraction-list): вернуть пять видимых кнопок" -m "- всегда создавать пять UI-позиций быстрых действий
- сохранять месячный контракт InteractionService без изменений
- закрепить disabled placeholders тестами и документацией"
          git push origin HEAD:agent/iteraction-list-five-visible-buttons
