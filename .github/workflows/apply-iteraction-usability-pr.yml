name: Apply IteractionList usability changes in PR

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/iteraction-list-usability-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract scoped patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/iteraction-list-usability-navigation.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply scoped HRM HuntTech changes\n'
          start = workflow.index(marker)
          run_start = workflow.index('        run: |\n', start) + len('        run: |\n')
          next_step = workflow.index('\n      - name: Validate patch text', run_start)
          lines = workflow[run_start:next_step].splitlines()
          shell = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-iteraction-usability.sh').write_text(shell, encoding='utf-8')
          PY

      - name: Execute scoped patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          bash /tmp/apply-iteraction-usability.sh > /tmp/apply-iteraction-usability.log 2>&1
          status=$?
          cat /tmp/apply-iteraction-usability.log
          exit "$status"

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteraction-list-usability-patch-log
          path: /tmp/apply-iteraction-usability.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Remove bootstrap files
        shell: bash
        run: |
          rm -f .github/workflows/iteraction-list-usability-navigation.yml
          rm -f .github/workflows/apply-iteraction-usability-pr.yml
          rm -f .ai/tasks/.iteraction-list-usability-navigation-trigger
          rm -f .ai/tasks/iteraction-list-usability-apply-error.log

      - name: Validate resulting tree
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          xml = Path('modules/web/src/com/company/hunttech/web/screens/iteractionlist/iteraction-list-edit.xml')
          java = Path('modules/web/src/com/company/hunttech/web/screens/iteractionlist/IteractionListEdit.java')
          ET.parse(xml)
          xml_text = xml.read_text(encoding='utf-8')
          java_text = java.read_text(encoding='utf-8')
          assert xml_text.count('stylename="iteraction-list-primary-picker"') == 2
          assert 'id="iteractionListNavigation"' in xml_text
          assert 'POPULAR_INTERACTION_BUTTONS = 5' in java_text
          assert 'calendar.add(Calendar.YEAR, -1)' in java_text
          assert 'iteractionTypeField.setValue(interaction)' in java_text
          assert 'getCaption().substring' not in java_text
          print('STATIC CONTRACTS: PASS')
          PY

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "ChatGPT HRM HuntTech"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(iteraction-list): улучшить навигацию и частые взаимодействия" \
            -m "- ограничить ширину двух picker-полей внутри диалога
          - добавить кликабельный индекс пяти блоков с фокусировкой
          - вывести пять равных кнопок топ-взаимодействий пользователя за год
          - обновить тесты, документацию и инструкцию Hermes

          [branch: agent/iteraction-list-usability-navigation]
          [deploy-local]
          [prompt: проверить точный HEAD PR в master; выполнить профильные тесты, ScreenViewIntegrityTest 8/8, Data View Integrity, SCSS семи тем, clean assemble, local deploy, HTTP /hrm/ 200 и smoke навигации/пяти годовых кнопок без изменения кода, merge и production]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
