name: Apply KeyValue loader overload

on:
  push:
    branches:
      - agent/job-candidate-edit-layout-fix
    paths:
      - .github/workflows/apply-keyvalue-loader-overload.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/job-candidate-edit-layout-fix
          fetch-depth: 0

      - name: Add KeyValueCollectionLoader overload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java_path = Path('modules/web/src/com/company/hunttech/web/screens/jobcandidate/JobCandidateEdit.java')
          java_text = java_path.read_text(encoding='utf-8')
          old = '''    private <E extends Entity> void preventAutoLoadUntilReady(CollectionLoader<E> loader,
                                                               java.util.function.BooleanSupplier ready) {
        loader.addPreLoadListener(e -> {
            if (!ready.getAsBoolean()) {
                e.preventLoad();
            }
        });
    }

    private void ensureReferenceLoadersLoaded() {'''
          new = '''    private <E extends Entity> void preventAutoLoadUntilReady(CollectionLoader<E> loader,
                                                               java.util.function.BooleanSupplier ready) {
        loader.addPreLoadListener(e -> {
            if (!ready.getAsBoolean()) {
                e.preventLoad();
            }
        });
    }

    // Блокирует автоматическую загрузку KeyValue loader до установки обязательных параметров.
    private void preventAutoLoadUntilReady(KeyValueCollectionLoader loader,
                                           java.util.function.BooleanSupplier ready) {
        loader.addPreLoadListener(e -> {
            if (!ready.getAsBoolean()) {
                e.preventLoad();
            }
        });
    }

    private void ensureReferenceLoadersLoaded() {'''
          if java_text.count(old) != 1:
              raise SystemExit(f'Ожидался один Java-блок, найдено: {java_text.count(old)}')
          java_path.write_text(java_text.replace(old, new, 1), encoding='utf-8')

          doc_path = Path('docs/ui/JobCandidateEdit_Spec.md')
          doc_text = doc_path.read_text(encoding='utf-8')
          marker = '''| Дата | Изменение |
|------|-----------|
'''
          replacement = marker + '| 2026-07-14 | Добавлена типобезопасная перегрузка `preventAutoLoadUntilReady(KeyValueCollectionLoader, BooleanSupplier)` для блокировки `lastProjectDl` до установки параметра кандидата. |\n'
          if doc_text.count(marker) != 1:
              raise SystemExit(f'Ожидалась одна таблица истории, найдено: {doc_text.count(marker)}')
          doc_path.write_text(doc_text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-keyvalue-loader-overload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(job-candidate): добавить перегрузку KeyValue loader" \
            -m "- сохранить существующий generic helper для CollectionLoader" \
            -m "- блокировать lastProjectDl типобезопасной перегрузкой" \
            -m "- обновить спецификацию JobCandidateEdit"
          git push origin HEAD:agent/job-candidate-edit-layout-fix
