name: Diagnose CandidateCVEdit finalization

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/candidate-cv-edit-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Extract finalization script
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/candidate-cv-redesign-finalize.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          body = source.split(marker, 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/finalize.sh').write_text(script, encoding='utf-8')
      - name: Run finalization with trace
        id: finalize
        continue-on-error: true
        shell: bash
        run: |
          rm -f .github/workflows/candidate-cv-redesign-diagnostic.yml
          bash -x /tmp/finalize.sh > /tmp/finalize.log 2>&1
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-cv-finalize-log
          path: /tmp/finalize.log
          if-no-files-found: error
