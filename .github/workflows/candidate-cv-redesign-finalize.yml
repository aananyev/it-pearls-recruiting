name: Finalize CandidateCVEdit redesign

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/candidate-cv-edit-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Finalize reviewed files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="56c395f3c8d2b8e6a4cff264333f2e1cb94cab0b"
          BRANCH="agent/candidate-cv-edit-redesign"
          git fetch origin master "$BRANCH"
          test "$(git rev-parse origin/master)" = "$BASE_SHA"
          REMOTE_HEAD="$(git rev-parse origin/$BRANCH)"

          for immutable in \
            modules/web/src/com/company/hunttech/web/screens/candidatecv/CandidateCVEdit.java \
            modules/global/src/com/company/hunttech/entity/CandidateCV.java \
            modules/global/src/com/company/hunttech/views.xml; do
            test "$(git rev-parse HEAD:$immutable)" = "$(git rev-parse $BASE_SHA:$immutable)"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          source = Path('.candidate-cv-payload-source').read_text(encoding='utf-8')
          match = re.search(r"python3 <<'PY'\n(.*?)\n\s*PY\n", source, re.S)
          if not match:
              raise SystemExit('Application Python block not found')
          code = textwrap.dedent(match.group(1))
          exec(compile(code, '.candidate-cv-payload-source', 'exec'), {'__name__': '__main__'})
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/core/test/com/company/hunttech/core/CandidateCVEditVisualContractTest.java')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '                "tabSheet", "tabCandidate", "tabCV", "tabLetter", "tabSkillTree", "tabFiles",\n',
              '                "openPositionsDc", "openPositionsDl", "candidateCVDc", "someFilesesDc", "skillTreesDc",\n'
              '                "resumePositionsDc", "resumePositionsLc", "usersDc", "usersDl",\n'
              '                "candidateLabel", "iteractionListLabelCandidate", "iteractionListLabelPosition",\n'
              '                "labelLastRecrutier", "machRegexpFromCV", "quoteTextArea",\n'
              '                "tabSheet", "tabCandidate", "tabCV", "tabLetter", "tabSkillTree", "tabFiles",\n',
              1)
          text = text.replace(
              '                "letterRecommendation", "rescanResume", "checkSkillFromJD", "skillTreesTable",\n'
              '                "someFilesTable", "datePostField", "editActions"\n',
              '                "letterRecommendation", "rescanResume", "checkSkillFromJD", "skillTreesTable",\n'
              '                "cvVbox", "candidateCVHBox", "letterHBox", "letterVbox", "skillBox",\n'
              '                "someFilesTable", "datePostField", "editActions"\n',
              1)
          anchor = '        assertTrue(skills < files);\n\n        String controller = readProjectFile(CONTROLLER);\n'
          addition = (
              '        assertTrue(skills < files);\n\n'
              '        assertTrue(xml.contains("caption=\\\"msg://msgCandidate\\\""));\n'
              '        assertTrue(xml.contains("caption=\\\"msg://msgCV\\\""));\n'
              '        assertTrue(xml.contains("caption=\\\"msg://msgLetter\\\""));\n'
              '        assertTrue(xml.contains("caption=\\\"msg://msgCVSkillTree\\\""));\n'
              '        assertTrue(xml.contains("caption=\\\"mainMsg://msgFiles\\\""));\n'
              '        assertTrue(xml.contains("<dialogMode height=\\\"800\\\""));\n'
              '        assertTrue(xml.contains("width=\\\"1200\\\"/>"));\n\n'
              '        String controller = readProjectFile(CONTROLLER);\n')
          if anchor not in text:
              raise SystemExit('Test patch anchor missing')
          text = text.replace(anchor, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

          rm -f \
            .candidate-cv-payload-source \
            .candidate-cv-redesign-trigger \
            .github/workflows/candidate-cv-redesign-publish.yml \
            .github/workflows/candidate-cv-redesign-finalize.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          xml = Path('modules/web/src/com/company/hunttech/web/screens/candidatecv/candidate-cv-edit.xml').read_text(encoding='utf-8')
          root = ET.fromstring(xml)
          ids = {n.attrib['id'] for n in root.iter() if 'id' in n.attrib}
          protected = {
           'tabSheet','tabCandidate','tabCV','tabLetter','tabSkillTree','tabFiles','candidateScrolBox',
           'candidateVbox','groupBox','dropZone','picVBox','candidateField','resumePositionField',
           'candidateCVFieldOpenPosition','onlyMySubscribeCheckBox','СandidateCVField','textFieldIOriginalCV',
           'loadToCVTextArea','originalCVLink','fileOriginalCVField','textFieldHuntTechCV','HuntTechCVLink',
           'fileCVField','candidatePic','candidateFaceDefaultImage','fileImageFaceUpload','rescanSkills',
           'resumeRecognitionButton','convertToTextButton','showOriginalButon','candidateCVRichTextArea',
           'cvResomandation','questionLetterRichTextArea','letterRichTextArea','commentLetterRichTextArea',
           'letterRecommendation','rescanResume','checkSkillFromJD','skillTreesTable','someFilesTable',
           'datePostField','editActions'}
          missing = sorted(protected - ids)
          if missing:
              raise SystemExit('Missing IDs: ' + ', '.join(missing))
          tabs = [n.attrib.get('id') for n in root.iter() if n.tag.endswith('tab')]
          if tabs != ['tabCandidate','tabCV','tabLetter','tabSkillTree','tabFiles']:
              raise SystemExit('Tab order changed')
          if re.findall(r'invoke="([^"]+)"', xml) != ['loadToCVTextArea','rescanCV','resumeRecognition','convertToText','showOriginalText','rescanCV','checkSkillFromJD']:
              raise SystemExit('Invoke contract changed')
          for fragment in ['stylename="candidate-cv-editor"','dropZone="dropZone"','<image id="candidatePic"','<image id="candidateFaceDefaultImage"']:
              if fragment not in xml:
                  raise SystemExit('Missing XML contract: ' + fragment)
          for theme in ['halo','havana','helium','hover','hunttech-modern','hunttech-modern-light','hunttech-modern-dark']:
              scss = (Path('modules/web/themes')/theme/'com.company.hunttech/candidate-cv-editor.scss').read_text(encoding='utf-8')
              styles = (Path('modules/web/themes')/theme/'styles.scss').read_text(encoding='utf-8')
              if '.candidate-cv-editor {' not in scss or '@import "com.company.hunttech/candidate-cv-editor";' not in styles or '@include candidate-cv-editor-theme;' not in styles:
                  raise SystemExit('Theme contract missing: ' + theme)
              depth = 0
              for line in scss.splitlines():
                  if depth == 0 and re.match(r'^\.v-[\w-]+', line.strip()):
                      raise SystemExit('Global selector: ' + line.strip())
                  depth += line.count('{') - line.count('}')
              if depth:
                  raise SystemExit('Unbalanced SCSS: ' + theme)
          PY

          cat > /tmp/expected <<'FILES'
          docs/ui/CandidateCVEdit_Spec.md
          docs/ui/README.md
          modules/core/test/com/company/hunttech/core/CandidateCVEditVisualContractTest.java
          modules/web/src/com/company/hunttech/web/screens/candidatecv/candidate-cv-edit.xml
          modules/web/themes/halo/com.company.hunttech/candidate-cv-editor.scss
          modules/web/themes/halo/styles.scss
          modules/web/themes/havana/com.company.hunttech/candidate-cv-editor.scss
          modules/web/themes/havana/styles.scss
          modules/web/themes/helium/com.company.hunttech/candidate-cv-editor.scss
          modules/web/themes/helium/styles.scss
          modules/web/themes/hover/com.company.hunttech/candidate-cv-editor.scss
          modules/web/themes/hover/styles.scss
          modules/web/themes/hunttech-modern/com.company.hunttech/candidate-cv-editor.scss
          modules/web/themes/hunttech-modern/styles.scss
          modules/web/themes/hunttech-modern-dark/com.company.hunttech/candidate-cv-editor.scss
          modules/web/themes/hunttech-modern-dark/styles.scss
          modules/web/themes/hunttech-modern-light/com.company.hunttech/candidate-cv-editor.scss
          modules/web/themes/hunttech-modern-light/styles.scss
          FILES
          sort -o /tmp/expected /tmp/expected
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE_SHA"

          git reset --mixed "$BASE_SHA"
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(candidate-cv): адаптировать форму к UI/UX-концепции" \
            -m "- перестроить визуальную компоновку без изменения функциональных контрактов
          - добавить локальный SCSS для семи поддерживаемых тем
          - закрепить legacy ID тестом и синхронизировать документацию"
          git push --force-with-lease=refs/heads/$BRANCH:$REMOTE_HEAD origin HEAD:refs/heads/$BRANCH
