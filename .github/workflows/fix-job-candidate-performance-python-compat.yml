name: Fix JobCandidateEdit performance Python compatibility

on:
  push:
    branches:
      - agent/job-candidate-edit-layout-fix
    paths:
      - '.github/workflows/fix-job-candidate-performance-python-compat.yml'

permissions:
  contents: write

jobs:
  fix-python:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/job-candidate-edit-layout-fix
          fetch-depth: 0

      - name: Patch Python 3.8 compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          report = Path('scripts/performance/job_candidate_edit_performance_report.py')
          text = report.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Dict, Iterable, List, Sequence, Tuple',
              'from typing import Dict, List, Optional, Sequence, Set, Tuple')
          text = text.replace('def parse_record(line: str, line_no: int) -> Record | None:',
                              'def parse_record(line: str, line_no: int) -> Optional[Record]:')
          text = text.replace('seen: Dict[str, set[str]] = defaultdict(set)',
                              'seen: Dict[str, Set[str]] = defaultdict(set)')
          text = text.replace('def format_optional_ms(value: float | None) -> str:',
                              'def format_optional_ms(value: Optional[float]) -> str:')
          text = text.replace('def main(argv: Sequence[str] | None = None) -> int:',
                              'def main(argv: Optional[Sequence[str]] = None) -> int:')
          report.write_text(text, encoding='utf-8')

          test = Path('scripts/performance/test_job_candidate_edit_performance_report.py')
          test_text = test.read_text(encoding='utf-8')
          if 'import sys\n' not in test_text:
              test_text = test_text.replace('import importlib.util\n', 'import importlib.util\nimport sys\n')
          test_text = test_text.replace(
              'assert SPEC.loader is not None\nSPEC.loader.exec_module(MODULE)',
              'assert SPEC.loader is not None\nsys.modules[SPEC.name] = MODULE\nSPEC.loader.exec_module(MODULE)')
          test.write_text(test_text, encoding='utf-8')
          PY

          python3 -m unittest scripts/performance/test_job_candidate_edit_performance_report.py
          git diff --check

      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-job-candidate-performance-python-compat.yml
          git config user.name "OpenAI Developer"
          git config user.email "openai-developer@users.noreply.github.com"
          git add -A
          git commit \
            -m "fix(job-candidate): обеспечить совместимость perf-скриптов" \
            -m "- поддержать Python 3.8 в генераторе отчёта
          - исправить загрузку модуля в unit-тесте
          - проверить генерацию Markdown и CSV"
          git push origin HEAD:agent/job-candidate-edit-layout-fix
