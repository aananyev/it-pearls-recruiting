name: Guard null candidate positions

on:
  push:
    branches:
      - agent/job-candidate-edit-layout-fix
    paths:
      - .github/workflows/guard-null-candidate-positions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/job-candidate-edit-layout-fix
          fetch-depth: 0

      - name: Apply exact null guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('modules/web/src/com/company/hunttech/web/screens/jobcandidate/JobCandidateEdit.java')
          text = path.read_text(encoding='utf-8')
          old = '''                for (JobCandidatePositionLists positionLists : positionListsForSuggest) {
                      positions.add(positionLists.getPositionList());
                  }'''
          new = '''                for (JobCandidatePositionLists positionLists : positionListsForSuggest) {
                      // Legacy-запись может не содержать выбранную позицию;
                      // null нельзя передавать в коллекционный параметр JPQL.
                      if (positionLists != null && positionLists.getPositionList() != null) {
                          positions.add(positionLists.getPositionList());
                      }
                  }'''
          # Нормализуем только ожидаемый уровень отступа тела цикла.
          old = old.replace('                      positions', '                    positions')
          old = old.replace('                  }', '                }')
          new = new.replace('                      //', '                    //')
          new = new.replace('                      if', '                    if')
          new = new.replace('                          positions', '                        positions')
          new = new.replace('                      }', '                    }')
          new = new.replace('                  }', '                }')
          if text.count(old) != 1:
              raise SystemExit(f'Ожидалось одно совпадение, найдено {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/guard-null-candidate-positions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(job-candidate): пропускать пустые дополнительные позиции" \
            -m "- не добавлять null в параметр positionTypes" \
            -m "- сохранить загрузку основной и дополнительных позиций"
          git push origin HEAD:agent/job-candidate-edit-layout-fix
