name: Trigger IteractionList five visible buttons fix

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/trigger-iteraction-five-visible-buttons.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iteraction-list-five-visible-buttons
          fetch-depth: 0

      - name: Extract and run targeted transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-iteraction-five-visible-buttons.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_iteraction_fix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_iteraction_fix.py

      - name: Remove transient workflows and publish fix
        shell: bash
        run: |
          rm .github/workflows/apply-iteraction-five-visible-buttons.yml
          rm .github/workflows/trigger-iteraction-five-visible-buttons.yml
          git config user.name "ChatGPT Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(iteraction-list): вернуть пять видимых кнопок" -m "- всегда создавать пять UI-позиций быстрых действий
- сохранить месячный контракт InteractionService без изменений
- закрепить disabled placeholders тестами и документацией"
          git push origin HEAD:agent/iteraction-list-five-visible-buttons
