###############################################################################
#                              Configuration                                  #
###############################################################################

cuba.springContextConfig = +com/company/hunttech/web-spring.xml

cuba.dispatcherSpringContextConfig = +com/company/hunttech/web-dispatcher-spring.xml

cuba.persistenceConfig = +com/company/hunttech/persistence.xml

cuba.metadataConfig = +com/company/hunttech/metadata.xml

cuba.viewsConfig = +com/company/hunttech/views.xml

cuba.windowConfig = +com/company/hunttech/web-screens.xml

cuba.menuConfig = +com/company/hunttech/web-menu.xml

cuba.permissionConfig = +com/company/hunttech/web-permissions.xml

cuba.mainMessagePack = +com.company.hunttech.web

cuba.anonymousSessionId = beb1d62c-3549-cc4a-3e04-e4f29e5f0f43

cuba.creditsConfig = +

###############################################################################
#                                  Other                                      #
###############################################################################

# Middleware connection
cuba.connectionUrlList = http://localhost:8080/app-core

# Set to false if the middleware works on different JVM
cuba.useLocalServiceInvocation = true

cuba.webContextName = app
cuba.availableLocales = Russian|ru;English|en
cuba.defaultLocale = ru
cuba.localeSelectVisible = true
cuba.web.theme = hover
cuba.web.widgetSet=com.company.hunttech.web.toolkit.ui.AppWidgetSet
cuba.rest.securityScope=GENERIC_UI
# Значение app-component конфигурации обязано совпадать с web-модулем:
# иначе при сборке или подключении компонента может открыться ExtMainScreen без фонового lifecycle.
cuba.web.mainScreenId=hrmMainScreen
# Must match middleware (core) when cuba.useLocalServiceInvocation=true.
# Override in ${app.home}/local.app.properties for local dev if needed.
cuba.fileStorageDir=${app.home}/fileStorage
cuba.web.loginScreenId=loginBranded
cuba.web.linkHandlerActions=open|o

cuba.web.componentsConfig = +com/hunttech/hrm/web/cuba-ui-component.xml



