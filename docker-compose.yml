# Локальный PostgreSQL для разработки HuntTech Recruiting.
# Запуск: docker compose up -d
# Остановка: docker compose down

services:
  postgres:
    image: postgres:11
    container_name: HuntTech-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuba}
      POSTGRES_DB: ${POSTGRES_DB:-HuntTech}
    volumes:
      - hunttech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cuba} -d ${POSTGRES_DB:-HuntTech}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hunttech_pgdata:
