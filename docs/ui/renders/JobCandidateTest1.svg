<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#f4f5f7"/>

  <!-- Top Toolbar -->
  <rect x="15" y="15" width="970" height="50" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  <text x="30" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Тест 1: Split-View (Halo)</text>
  
  <!-- Search Field -->
  <rect x="350" y="25" width="200" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="44" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Поиск по ФИО...</text>
  
  <!-- Search & Action Buttons -->
  <rect x="560" y="25" width="80" height="30" rx="4" fill="#3b82f6"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Найти</text>

  <rect x="650" y="25" width="150" height="30" rx="4" fill="#10b981"/>
  <text x="725" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">+ Создать кандидата</text>

  <rect x="810" y="25" width="90" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="855" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Обновить</text>

  <!-- Main Split Layout -->
  <!-- Left Box: Candidates Table (60% width) -->
  <rect x="15" y="80" width="575" height="505" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Table Header -->
  <rect x="15" y="80" width="575" height="35" rx="6" fill="#f8fafc"/>
  <line x1="15" y1="115" x2="590" y2="115" stroke="#e2e8f0"/>
  
  <text x="30" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ФОТО</text>
  <text x="90" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ФИО КАНДИДАТА</text>
  <text x="320" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ДОЛЖНОСТЬ</text>
  <text x="490" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ГОРОД</text>

  <!-- Table Row 1 (Selected) -->
  <rect x="15" y="115" width="575" height="45" fill="#eff6ff"/>
  <circle cx="45" cy="137" r="16" fill="#bfdbfe"/>
  <text x="45" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2563eb">АИ</text>
  <text x="90" y="142" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Алексей Иванов</text>
  <text x="320" y="142" font-family="Arial, sans-serif" font-size="13" fill="#334155">Java Developer</text>
  <text x="490" y="142" font-family="Arial, sans-serif" font-size="13" fill="#334155">Москва</text>
  <line x1="15" y1="160" x2="590" y2="160" stroke="#e2e8f0"/>

  <!-- Table Row 2 -->
  <circle cx="45" cy="182" r="16" fill="#fed7aa"/>
  <text x="45" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ea580c">МП</text>
  <text x="90" y="187" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">Мария Петрова</text>
  <text x="320" y="187" font-family="Arial, sans-serif" font-size="13" fill="#334155">QA Engineer</text>
  <text x="490" y="187" font-family="Arial, sans-serif" font-size="13" fill="#334155">Санкт-Петербург</text>
  <line x1="15" y1="205" x2="590" y2="205" stroke="#e2e8f0"/>

  <!-- Table Row 3 -->
  <circle cx="45" cy="227" r="16" fill="#bbf7d0"/>
  <text x="45" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#16a34a">СБ</text>
  <text x="90" y="232" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">Сергей Борисов</text>
  <text x="320" y="232" font-family="Arial, sans-serif" font-size="13" fill="#334155">DevOps Engineer</text>
  <text x="490" y="232" font-family="Arial, sans-serif" font-size="13" fill="#334155">Новосибирск</text>
  <line x1="15" y1="250" x2="590" y2="250" stroke="#e2e8f0"/>

  <!-- Table Row 4 -->
  <circle cx="45" cy="272" r="16" fill="#fbcfe8"/>
  <text x="45" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#db2777">ЕК</text>
  <text x="90" y="277" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">Елена Козлова</text>
  <text x="320" y="277" font-family="Arial, sans-serif" font-size="13" fill="#334155">Product Manager</text>
  <text x="490" y="277" font-family="Arial, sans-serif" font-size="13" fill="#334155">Казань</text>
  <line x1="15" y1="295" x2="590" y2="295" stroke="#e2e8f0"/>

  <!-- Right Box: Candidate Detail Pane (40% width) -->
  <rect x="605" y="80" width="380" height="505" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Detail Header: Photo & Name -->
  <circle cx="660" cy="135" r="40" fill="#2563eb"/>
  <text x="660" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">АИ</text>
  
  <text x="720" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Алексей Иванов</text>
  <text x="720" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Java Developer</text>
  <text x="720" y="162" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Москва</text>

  <!-- Detail Actions -->
  <rect x="625" y="195" width="160" height="32" rx="4" fill="#3b82f6"/>
  <text x="705" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Открыть карточку</text>

  <rect x="795" y="195" width="165" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="877" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Взаимодействие</text>

  <!-- Detail Information Grid -->
  <rect x="625" y="250" width="340" height="150" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="640" y="280" font-weight="700" fill="#64748b">Телефон:</text>
    <text x="740" y="280" fill="#1e293b">+7 999 123 4567</text>
    
    <text x="640" y="310" font-weight="700" fill="#64748b">Email:</text>
    <text x="740" y="310" fill="#2563eb">alex@hunttech.ru</text>
    
    <text x="640" y="340" font-weight="700" fill="#64748b">Telegram:</text>
    <text x="740" y="340" fill="#1e293b">@alex_dev</text>
    
    <text x="640" y="370" font-weight="700" fill="#64748b">Компания:</text>
    <text x="740" y="370" fill="#1e293b">ООО "АйТи Тех"</text>
  </g>

  <!-- Recent History Title -->
  <text x="625" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">История последних взаимодействий</text>
  
  <!-- History Details -->
  <rect x="625" y="445" width="340" height="110" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="640" y="475" font-family="Arial, sans-serif" font-size="13" fill="#334155">Всего зарегистрировано взаимодействий: 3</text>
  <circle cx="648" cy="510" r="4" fill="#10b981"/>
  <text x="660" y="514" font-family="Arial, sans-serif" font-size="12" fill="#475569">Интервью с тимлидом (14.08.2026)</text>
  <circle cx="648" cy="530" r="4" fill="#f59e0b"/>
  <text x="660" y="534" font-family="Arial, sans-serif" font-size="12" fill="#475569">Первичный контакт: отправка резюме (10.08.2026)</text>
</svg>
