<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#f4f5f7"/>

  <!-- Top Action Toolbar -->
  <rect x="15" y="15" width="970" height="50" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  
  <rect x="30" y="25" width="120" height="30" rx="4" fill="#10b981"/>
  <text x="90" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Создать</text>

  <rect x="160" y="25" width="120" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="220" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Изменить</text>

  <rect x="290" y="25" width="120" height="30" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="350" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#b91c1c">Удалить</text>

  <rect x="420" y="25" width="120" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="480" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Обновить</text>

  <rect x="550" y="25" width="130" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="615" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Экспорт Excel</text>

  <text x="970" y="46" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Тест 2: High-Density DataGrid</text>

  <!-- Left Side Panel: Accordion Filters (260px) -->
  <rect x="15" y="80" width="260" height="505" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  
  <text x="35" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Фильтры кандидатов</text>
  
  <g font-family="Arial, sans-serif" font-size="13" fill="#475569">
    <!-- Filter Name -->
    <text x="35" y="155" font-weight="600">Поиск по ФИО:</text>
    <rect x="35" y="165" width="220" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="45" y="184" fill="#94a3b8">Введите имя...</text>

    <!-- Filter City -->
    <text x="35" y="225" font-weight="600">Город проживания:</text>
    <rect x="35" y="235" width="220" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="45" y="254" fill="#94a3b8">Город...</text>
  </g>

  <!-- Filter Action Buttons -->
  <rect x="35" y="300" width="220" height="35" rx="4" fill="#3b82f6"/>
  <text x="145" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Применить фильтр</text>

  <rect x="35" y="350" width="220" height="35" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Сбросить</text>

  <!-- Right Side Panel: Main DataGrid -->
  <rect x="290" y="80" width="695" height="505" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- DataGrid Header -->
  <rect x="290" y="80" width="695" height="35" rx="6" fill="#f8fafc"/>
  <line x1="290" y1="115" x2="985" y2="115" stroke="#e2e8f0"/>
  
  <text x="310" y="102" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">АВАТАР</text>
  <text x="370" y="102" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">ФИО КАНДИДАТА</text>
  <text x="540" y="102" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">ЖЕЛАЕМАЯ ДОЛЖНОСТЬ</text>
  <text x="730" y="102" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">ГОРОД</text>
  <text x="830" y="102" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">КОМПАНИЯ</text>

  <!-- Row 1 -->
  <circle cx="330" cy="137" r="13" fill="#bfdbfe"/>
  <text x="330" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#2563eb">АИ</text>
  <text x="370" y="141" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Алексей Иванов</text>
  <text x="540" y="141" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">Java Developer</text>
  <text x="730" y="141" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">Москва</text>
  <text x="830" y="141" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">ООО "АйТи Тех"</text>
  <line x1="290" y1="160" x2="985" y2="160" stroke="#e2e8f0"/>

  <!-- Row 2 -->
  <circle cx="330" cy="182" r="13" fill="#fed7aa"/>
  <text x="330" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ea580c">МП</text>
  <text x="370" y="186" font-family="Arial, sans-serif" font-size="12.5" fill="#1e293b">Мария Петрова</text>
  <text x="540" y="186" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">QA Engineer</text>
  <text x="730" y="186" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">Санкт-Петербург</text>
  <text x="830" y="186" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">ЗАО "Спектр"</text>
  <line x1="290" y1="205" x2="985" y2="205" stroke="#e2e8f0"/>

  <!-- Row 3 -->
  <circle cx="330" cy="227" r="13" fill="#bbf7d0"/>
  <text x="330" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#16a34a">СБ</text>
  <text x="370" y="231" font-family="Arial, sans-serif" font-size="12.5" fill="#1e293b">Сергей Борисов</text>
  <text x="540" y="231" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">DevOps Engineer</text>
  <text x="730" y="231" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">Новосибирск</text>
  <text x="830" y="231" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">ОблакоСофт</text>
  <line x1="290" y1="250" x2="985" y2="250" stroke="#e2e8f0"/>

  <!-- Row 4 -->
  <circle cx="330" cy="272" r="13" fill="#fbcfe8"/>
  <text x="330" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#db2777">ЕК</text>
  <text x="370" y="276" font-family="Arial, sans-serif" font-size="12.5" fill="#1e293b">Елена Козлова</text>
  <text x="540" y="276" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">Product Manager</text>
  <text x="730" y="276" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">Казань</text>
  <text x="830" y="276" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">ООО "Вектор"</text>
  <line x1="290" y1="295" x2="985" y2="295" stroke="#e2e8f0"/>

  <!-- Pagination Controls at bottom -->
  <line x1="290" y1="540" x2="985" y2="540" stroke="#e2e8f0"/>
  <text x="310" y="565" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Страница 1 из 5 (показано 1-4 из 20)</text>
  
  <rect x="880" y="548" width="25" height="25" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="892.5" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">&lt;</text>
  <rect x="915" y="548" width="25" height="25" rx="4" fill="#3b82f6"/>
  <text x="927.5" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <rect x="950" y="548" width="25" height="25" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="962.5" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">&gt;</text>
</svg>
