<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#f4f5f7"/>

  <!-- Top Toolbar -->
  <rect x="15" y="15" width="970" height="50" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  <text x="30" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Тест 4: Executive Card-Grid</text>

  <!-- Search Field -->
  <rect x="420" y="25" width="300" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="432" y="44" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Быстрый поиск кандидатов...</text>

  <!-- Action Buttons -->
  <rect x="730" y="25" width="110" height="30" rx="4" fill="#3b82f6"/>
  <text x="785" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Найти</text>

  <rect x="850" y="25" width="120" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="910" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Обновить</text>

  <!-- Card Grid (3 columns) -->
  <!-- Card 1 -->
  <rect x="15" y="85" width="310" height="150" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="55" cy="140" r="32" fill="#bfdbfe"/>
  <text x="55" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">АИ</text>
  <text x="105" y="125" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Алексей Иванов</text>
  <text x="105" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">Java Developer</text>
  <text x="105" y="162" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Москва</text>
  <rect x="30" y="195" width="265" height="28" rx="4" fill="#3b82f6"/>
  <text x="162.5" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Открыть профиль</text>

  <!-- Card 2 -->
  <rect x="345" y="85" width="310" height="150" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="385" cy="140" r="32" fill="#fed7aa"/>
  <text x="385" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ea580c">МП</text>
  <text x="435" y="125" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Мария Петрова</text>
  <text x="435" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">QA Engineer</text>
  <text x="435" y="162" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Санкт-Петербург</text>
  <rect x="360" y="195" width="265" height="28" rx="4" fill="#3b82f6"/>
  <text x="492.5" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Открыть профиль</text>

  <!-- Card 3 -->
  <rect x="675" y="85" width="310" height="150" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="715" cy="140" r="32" fill="#bbf7d0"/>
  <text x="715" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a">СБ</text>
  <text x="765" y="125" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Сергей Борисов</text>
  <text x="765" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">DevOps Engineer</text>
  <text x="765" y="162" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Новосибирск</text>
  <rect x="690" y="195" width="265" height="28" rx="4" fill="#3b82f6"/>
  <text x="822.5" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Открыть профиль</text>

  <!-- Card 4 -->
  <rect x="15" y="255" width="310" height="150" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="55" cy="310" r="32" fill="#fbcfe8"/>
  <text x="55" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#db2777">ЕК</text>
  <text x="105" y="295" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Елена Козлова</text>
  <text x="105" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">Product Manager</text>
  <text x="105" y="332" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Казань</text>
  <rect x="30" y="365" width="265" height="28" rx="4" fill="#3b82f6"/>
  <text x="162.5" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Открыть профиль</text>
</svg>
