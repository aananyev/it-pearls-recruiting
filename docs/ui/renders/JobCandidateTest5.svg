    <text x="300" y="230"><tspan font-weight="700" fill="#64748b">Email: </tspan>alex@hunttech.ru</text>
    <text x="540" y="230"><tspan font-weight="700" fill="#64748b">Telegram: </tspan>@alex_dev</text>
    
