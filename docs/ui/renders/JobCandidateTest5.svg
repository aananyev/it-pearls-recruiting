  <text x="300" y="360" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">DevOps Engineer</text>
  <text x="550" y="360" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">Новосибирск</text>
