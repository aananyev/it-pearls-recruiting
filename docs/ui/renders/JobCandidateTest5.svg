  <text x="60" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Детальные контакты и история кандидата: Алексей Иванов</text>
  
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
