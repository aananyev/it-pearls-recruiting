  <text x="300" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ДОЛЖНОСТЬ</text>
  <text x="550" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ГОРОД</text>
  <text x="800" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ДАТА СОЗДАНИЯ</text>

