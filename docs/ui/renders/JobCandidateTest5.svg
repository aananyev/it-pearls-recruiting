  <text x="30" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Тест 5: Row Expansion (Details)</text>

  <rect x="350" y="25" width="120" height="30" rx="4" fill="#10b981"/>
  <text x="410" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Создать</text>

  <rect x="480" y="25" width="120" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="540" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Изменить</text>

