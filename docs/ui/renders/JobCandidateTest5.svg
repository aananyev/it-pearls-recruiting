  <text x="300" y="320" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">QA Engineer</text>
  <text x="550" y="320" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">Санкт-Петербург</text>
